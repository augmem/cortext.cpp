[project]
name = "augmem.hermes"
version = "0.1.0"
description = "Cortext memory provider plugin for Hermes Agent"
readme = "README.md"
authors = [{ name = "augmem" }]
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["hermes", "cortext", "memory", "agents", "augmem"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "augmem.cortext>=1.1.11",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/augmem/cortext"
Repository = "https://github.com/augmem/cortext"
Issues = "https://github.com/augmem/cortext/issues"

[project.scripts]
augmem-hermes = "augmem.hermes.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["augmem", "augmem.hermes", "augmem.hermes.*"]
namespaces = true

[tool.setuptools.package-data]
"augmem.hermes.plugin" = ["plugin.yaml"]

[tool.uv.sources]
"augmem.cortext" = { path = "../../bindings/python", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: live model + native Cortext e2e (set CORTEXT_HERMES_LIVE=1)",
]
