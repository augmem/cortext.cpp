name: cortext
version: 0.1.0
description: "Silent local adaptive memory (text/image/audio). Automatic ingest+recall only; no agent tools or system-prompt branding."
hooks:
  - on_turn_start
  - prefetch
  - queue_prefetch
  - sync_turn
  - on_memory_write
  - on_delegation
  - on_pre_compress
  - on_session_end
  - on_session_switch
  - shutdown
